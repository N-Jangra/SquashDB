<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SquashDB - Bottom Menu Icons</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="index.css"><script src="logcat.js"></script><script src="lucide.min.js"></script></head>
<body><div id="app-container">
<main><section class="tab-content active">
<div class="show-detail-topbar">
  <button class="page-back-btn show-detail-topbar-link show-detail-topbar-back" type="button" data-back-fallback="settings.html"><i data-lucide="chevron-left"></i>Back</button>
</div>
<div class="settings-page-header">
  <h2>Bottom Menu Icons</h2>
  <p>Pick an icon for each tab in the bottom navigation bar.</p>
</div>

<div class="settings-section">
  <h4 class="settings-section-title">Dashboard</h4>
  <div class="icon-picker-carousel-wrap"><div id="nav-icon-picker-dashboard" class="icon-picker-carousel" data-nav-key="dashboard"></div></div>
</div>

<div class="settings-section">
  <h4 class="settings-section-title">Timeline</h4>
  <div class="icon-picker-carousel-wrap"><div id="nav-icon-picker-timeline" class="icon-picker-carousel" data-nav-key="timeline"></div></div>
</div>

<div class="settings-section">
  <h4 class="settings-section-title">Discover</h4>
  <div class="icon-picker-carousel-wrap"><div id="nav-icon-picker-discover" class="icon-picker-carousel" data-nav-key="discover"></div></div>
</div>

<div class="settings-section">
  <h4 class="settings-section-title">Sources</h4>
  <div class="icon-picker-carousel-wrap"><div id="nav-icon-picker-sources" class="icon-picker-carousel" data-nav-key="sources"></div></div>
</div>

<div class="settings-section">
  <h4 class="settings-section-title">Explore</h4>
  <div class="icon-picker-carousel-wrap"><div id="nav-icon-picker-explore" class="icon-picker-carousel" data-nav-key="explore"></div></div>
</div>

<div class="settings-section">
  <h4 class="settings-section-title">Statistics</h4>
  <div class="icon-picker-carousel-wrap"><div id="nav-icon-picker-stats" class="icon-picker-carousel" data-nav-key="stats"></div></div>
</div>

<div class="settings-section">
  <h4 class="settings-section-title">Settings</h4>
  <div class="icon-picker-carousel-wrap"><div id="nav-icon-picker-settings" class="icon-picker-carousel" data-nav-key="settings"></div></div>
</div>

<div class="page-back-actions">
  <button class="page-back-btn" type="button" data-back-fallback="settings.html"><i data-lucide="arrow-left"></i> Back to Settings</button>
</div>

</section></main>
</div><script src="applock.js"></script><script src="metadata.js"></script><script src="app.js"></script><script src="fonts.js"></script></body></html>

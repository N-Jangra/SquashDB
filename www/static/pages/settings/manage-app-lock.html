<!DOCTYPE html>
<html lang="en">
<head>
<base href="../../../">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SquashDB - App Password</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="static/index.css">
  <script src="core/logcat.js"></script><script src="lucide.min.js"></script>
</head>
<body class="manage-screen">
  <div id="app-container">
    <header class="settings-ios-header">
      <button class="settings-ios-back page-back-btn" type="button" data-back-fallback="static/pages/settings/settings.html">‹ Back</button>
      <h1>App Password</h1>
      <span class="settings-ios-header-spacer" aria-hidden="true"></span>
    </header>
    <main>
      <section class="tab-content active">
        <p class="manage-intro">Locks the app behind a PIN, pattern, or password when it's opened. This deters casual snooping only — it does not encrypt your data.</p>
        <div class="settings-section">
          <h4 class="settings-section-title">Lock method</h4>
          <div id="app-lock-method-picker" class="settings-section-inner"></div>
        </div>
        <div class="settings-section" id="app-lock-setup-section" style="display:none;">
          <h4 class="settings-section-title" id="app-lock-setup-title">Set Your Secret</h4>
          <div id="app-lock-setup-area"></div>
        </div>
        <div class="settings-section" id="app-lock-questions-section" style="display:none;">
          <h4 class="settings-section-title">Security Questions</h4>
          <p class="setting-desc">Required so you can reset your password if you forget it. All 3 must be answered.</p>
          <div id="app-lock-questions-area"></div>
          <button type="button" class="btn btn-primary" id="app-lock-save-btn" style="width:100%;margin-top:12px;">Save</button>
        </div>
      </section>
    </main>
  </div>
  <script src="core/applock.js"></script><script src="features/metadata.js"></script>
  <script src="core/app-navigation.js"></script><script src="core/app-backups.js"></script><script src="core/app-search.js"></script><script src="app.js"></script><script src="core/fonts.js"></script>
  <script src="manage-app-lock.js"></script>
</body>
</html>

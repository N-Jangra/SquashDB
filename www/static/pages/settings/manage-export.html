<!DOCTYPE html>
<html lang="en">
<head>
<base href="../../../">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SquashDB - Export List</title>
<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="static/index.css">
<script defer src="core/logcat.js"></script><script defer src="lucide.min.js"></script>
</head>
<body class="manage-screen">
  <div id="app-container">
    <header class="settings-ios-header"><button class="settings-ios-back page-back-btn" type="button" data-back-fallback="static/pages/settings/settings.html">‹ Back</button><h1>Export List</h1><span class="settings-ios-header-spacer" aria-hidden="true"></span></header>
    <main><section class="tab-content active">
      <p class="manage-intro">Download your tracked titles in a format you can edit, share, or import again later.</p>
      <div class="settings-section">
        <div class="form-group"><label for="export-category">Category</label><select id="export-category" class="form-control"></select></div>
        <div class="btn-group-vertical">
          <button type="button" class="btn btn-secondary" data-export-format="csv"><i data-lucide="file-text"></i> Export CSV</button>
          <button type="button" class="btn btn-secondary" data-export-format="tsv"><i data-lucide="table-2"></i> Export TSV</button>
          <button type="button" class="btn btn-secondary" data-export-format="txt"><i data-lucide="file"></i> Export TXT</button>
        </div>
        <p id="export-list-status" class="settings-row-note" aria-live="polite"></p>
      </div>
    </section></main>
  </div>
  <script defer src="core/applock.js"></script><script defer src="features/metadata.js"></script><script defer src="core/app-navigation.js"></script><script defer src="core/app-backups.js"></script><script defer src="core/app-search.js"></script><script defer src="app.js"></script><script defer src="core/fonts.js"></script><script defer src="features/export-list.js"></script>
</body>
</html>

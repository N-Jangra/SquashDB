<!DOCTYPE html>
<html lang="en">
<head>
<base href="../../../">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SquashDB - Dashboard</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="squashdb-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="static/index.css">
  <script src="core/logcat.js"></script><script src="lucide.min.js"></script>
</head>
<body>
  <div id="app-container">
    <div class="chips-container" id="category-chips"></div>
    <div id="search-container" class="search-container">
      <i data-lucide="search"></i>
      <input type="text" id="global-search" class="search-input" placeholder="Search title, notes, genres, tags..." autocomplete="off">
      <button type="button" id="dashboard-sort-btn" class="timeline-filter-icon-btn" title="Sort list"><i data-lucide="arrow-down-up"></i></button>
      <button type="button" id="dashboard-filter-btn" class="timeline-filter-icon-btn" title="Filter list"><i data-lucide="sliders-horizontal"></i></button>
    </div>
    <div id="dashboard-search-history" class="dashboard-search-history" style="display:none;"></div>
    <div id="dashboard-filter-chips" class="dashboard-filter-chips" aria-label="Dashboard filters"></div>

    <main>
      <section id="tab-dashboard" class="tab-content active">
        <div id="dashboard-refresh-status" class="dashboard-refresh-status" aria-live="polite"></div>
        <div id="dashboard-insights" class="dashboard-insights"></div>
        <div id="notes-container" class="notes-container"></div>
        <div id="dashboard-empty" class="empty-state" style="display:none;">
          <i data-lucide="bookmark-x"></i>
          <h3 id="dashboard-empty-title">No Items Found</h3>
          <p id="dashboard-empty-message">Tap the floating "+" button to add games, movies, series, or books to your list.</p>
          <div id="dashboard-empty-suggestions" class="dashboard-empty-suggestions"></div>
        </div>
      </section>
    </main>

    <div id="grid-selection-bar" class="grid-selection-bar" style="display:none;">
      <span id="grid-selection-count" class="grid-selection-count">0 selected</span>
      <div class="grid-selection-actions">
        <button type="button" class="btn btn-secondary" id="grid-selection-cancel">Cancel</button>
        <button type="button" class="btn btn-primary" id="grid-selection-delete">Delete</button>
      </div>
    </div>

    <button id="add-fab" class="fab" title="Add Tracking Entry"><i data-lucide="plus"></i></button>

    <nav class="bottom-nav">
      <a class="nav-item active" data-tab="tab-dashboard" href="static/pages/main/dashboard.html" aria-label="Dashboard"><i data-lucide="layout-grid"></i></a>
      <a class="nav-item" data-tab="tab-timeline" href="static/pages/main/timeline.html" aria-label="Timeline"><i data-lucide="calendar"></i></a>
      <a class="nav-item" data-tab="tab-discover" href="static/pages/main/discover.html" aria-label="Discover"><i data-lucide="search"></i></a><a class="nav-item" data-tab="tab-sources" href="static/pages/main/sources.html" aria-label="Sources"><i data-lucide="database"></i></a><a class="nav-item" data-tab="tab-explore" href="static/pages/main/explore.html" aria-label="Explore"><i data-lucide="compass"></i></a>
      <a class="nav-item" data-tab="tab-stats" href="static/pages/main/statistics.html" aria-label="Statistics"><i data-lucide="pie-chart"></i></a>
      <a class="nav-item" data-tab="tab-settings" href="static/pages/settings/settings.html" aria-label="Settings"><i data-lucide="settings"></i></a>
    </nav>

    <div id="item-modal" class="modal-overlay">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modal-title" class="modal-title">Add Tracking Entry</h3>
          <button class="modal-close" id="modal-close-btn">&times;</button>
        </div>
        <form id="tracker-form">
          <input type="hidden" id="entry-id">
          <div class="form-group">
            <label for="entry-title">Title / Name</label>
            <div class="entry-title-input-row">
              <input type="text" id="entry-title" class="form-control" placeholder="e.g., Elden Ring, Naruto, Dune" required>
              <button type="button" class="icon-btn" id="scan-code-btn" title="Scan barcode or QR code"><i data-lucide="scan-line"></i></button>
            </div>
          </div>
          <div class="form-group">
            <label>Category</label>
            <input type="hidden" id="entry-category">
            <div class="category-pill" id="entry-category-label"></div>
          </div>
          <div id="dynamic-fields" class="dynamic-fields"></div>
          <div class="form-group">
            <label for="entry-notes">Notes / Thoughts</label>
            <textarea id="entry-notes" class="form-control" rows="3" placeholder="Add optional details, links, or comments..."></textarea>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" id="modal-cancel-btn">Cancel</button>
            <button type="submit" class="btn btn-primary" id="modal-save-btn">Save Entry</button>
          </div>
        </form>
      </div>
    </div>

    <div id="picker-modal" class="modal-overlay">
      <div class="modal-content picker-sheet">
        <div class="modal-header">
          <h3 id="picker-modal-title" class="modal-title">Options</h3>
          <button class="modal-close" id="picker-modal-close">&times;</button>
        </div>
        <div id="picker-options-list" class="picker-options-list"></div>
      </div>
    </div>
  </div>
  <script src="core/applock.js"></script><script src="features/metadata.js"></script><script src="core/cache-manager.js"></script><script src="core/app-navigation.js"></script><script src="core/app-backups.js"></script><script src="core/app-search.js"></script><script src="app.js"></script><script src="core/fonts.js"></script>
</body>
</html>

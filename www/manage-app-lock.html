<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SquashDB - App Password</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="index.css">
  <script src="lucide.min.js"></script>
</head>
<body>
  <div id="app-container">
    <main>
      <section class="tab-content active">
        <div class="settings-section">
          <h4 class="settings-section-title">App Password</h4>
          <p class="setting-desc">Locks the app behind a PIN, pattern, or password when it's opened. This deters casual snooping only — it does not encrypt your data.</p>
          <div id="app-lock-method-picker" class="settings-section-inner"></div>
        </div>
        <div class="settings-section" id="app-lock-setup-section" style="display:none;">
          <h4 class="settings-section-title" id="app-lock-setup-title">Set Your Secret</h4>
          <div id="app-lock-setup-area"></div>
        </div>
        <div class="settings-section" id="app-lock-questions-section" style="display:none;">
          <h4 class="settings-section-title">Security Questions</h4>
          <p class="setting-desc">Required so you can reset your password if you forget it. All 3 must be answered.</p>
          <div id="app-lock-questions-area"></div>
          <button type="button" class="btn btn-primary" id="app-lock-save-btn" style="width:100%;margin-top:12px;">Save</button>
        </div>
        <div class="page-back-actions">
          <button class="page-back-btn" type="button" data-back-fallback="settings.html"><i data-lucide="arrow-left"></i> Back to Settings</button>
        </div>
      </section>
    </main>
  </div>
  <script src="applock.js"></script><script src="metadata.js"></script>
  <script src="app.js"></script>
  <script src="manage-app-lock.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SquashDB - Statistics</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="index.css"><script src="lucide.min.js"></script></head>
<body><div id="app-container">
<div class="chips-container" id="category-chips"></div>
<main><section id="tab-stats" class="tab-content active"><div class="stats-grid"><div class="stats-card stats-card-rate"><span class="stats-value" id="stats-rate">0%</span><span class="stats-label">Completion Rate</span></div><div class="stats-card stats-card-active"><span class="stats-value" id="stats-active">0</span><span class="stats-label">In Progress</span></div><div class="stats-card stats-card-queued"><span class="stats-value" id="stats-queued">0</span><span class="stats-label">Watchlist / Queue</span></div><div class="stats-card stats-card-completed"><span class="stats-value" id="stats-completed">0</span><span class="stats-label">Completed</span></div><div class="stats-card stats-card-total"><span class="stats-value" id="stats-total">0</span><span class="stats-label">Total Tracked</span></div><div class="stats-card stats-card-time-left" id="stats-time-left-card" style="display:none;"><span class="stats-value" id="stats-time-left">0h</span><span class="stats-label">Time Left</span></div><div class="stats-card stats-card-time-done" id="stats-time-done-card" style="display:none;"><span class="stats-value" id="stats-time-done">0h</span><span class="stats-label">Time Completed</span></div></div></section></main>
<nav class="bottom-nav"><a class="nav-item" data-tab="tab-dashboard" href="dashboard.html" aria-label="Dashboard"><i data-lucide="layout-grid"></i></a><a class="nav-item" data-tab="tab-timeline" href="timeline.html" aria-label="Timeline"><i data-lucide="calendar"></i></a><a class="nav-item active" data-tab="tab-stats" href="statistics.html" aria-label="Statistics"><i data-lucide="pie-chart"></i></a><a class="nav-item" data-tab="tab-settings" href="settings.html" aria-label="Settings"><i data-lucide="settings"></i></a></nav>
</div><script src="applock.js"></script><script src="metadata.js"></script><script src="app.js"></script></body></html>

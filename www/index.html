<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SquashDB</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#030712;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
    main{height:100%;display:grid;place-items:center;text-align:center}
    .boot{animation:in .42s ease-out both}.boot img{width:64px;height:64px;object-fit:contain;animation:pulse 1.8s ease-in-out infinite}.boot p{color:#94a3b8}
    .dots{color:#6366f1;letter-spacing:6px;font-size:24px;animation:pulse 1s ease-in-out infinite}
    @keyframes in{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
    @keyframes pulse{50%{opacity:.55;transform:scale(1.04)}}
  </style>
</head>
<body>
  <main aria-label="Loading SquashDB"><section class="boot"><img src="squashdb-logo.svg" alt=""><h1>SquashDB</h1><p>Loading your dashboard</p><div class="dots">•••</div></section></main>
  <script>
    let multiplier = 1;
    try {
      const prefs = JSON.parse(localStorage.getItem("squashdb_prefs") || "{}");
      multiplier = { off: .001, fast: .5, normal: 1, slow: 1.75 }[prefs.animationSpeed] || 1;
    } catch (e) {}
    setTimeout(() => location.replace("static/pages/main/dashboard.html"), 1500 * multiplier);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SquashDB - App Name</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="index.css">
  <script src="lucide.min.js"></script>
</head>
<body>
  <div id="app-container">
    <main>
      <section class="tab-content active">
        <div class="settings-page-header">
          <h2>App Name</h2>
          <p>Pick a home screen name. Applying a new name briefly restarts the app.</p>
        </div>

        <div class="settings-section">
          <div id="app-name-picker" class="picker-options-list"></div>
          <p class="settings-row-note" id="app-name-native-note" style="margin: 12px 2px 0; display: none;">App name switching only works in the installed Android app, not in a browser preview.</p>
        </div>

        <div class="page-back-actions">
          <button class="page-back-btn" type="button" data-back-fallback="settings.html"><i data-lucide="arrow-left"></i> Back to Settings</button>
        </div>
      </section>
    </main>
  </div>
  <script src="metadata.js"></script>
  <script src="app.js"></script>
</body>
</html>

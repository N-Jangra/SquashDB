<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SquashDB - Older Logs</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="index.css">
  <script src="logcat.js"></script><script src="lucide.min.js"></script>
</head>
<body>
  <div id="app-container">
    <main>
      <section class="tab-content active">
        <div class="show-detail-topbar">
          <button class="page-back-btn show-detail-topbar-link show-detail-topbar-back" type="button" data-back-fallback="logcat.html"><i data-lucide="chevron-left"></i>Back</button>
          <span class="show-detail-topbar-category">Older Logs</span>
        </div>

        <div class="logcat-history-filters">
          <label>Date from<input type="date" id="log-filter-date-from"></label>
          <label>Date to<input type="date" id="log-filter-date-to"></label>
          <label>Time from<input type="time" id="log-filter-time-from"></label>
          <label>Time to<input type="time" id="log-filter-time-to"></label>
          <label>Level<select id="log-filter-level"><option value="all">All levels</option><option value="info">Info</option><option value="warn">Warnings</option><option value="error">Errors</option></select></label>
          <label>Page<input type="search" id="log-filter-page" placeholder="e.g. dashboard"></label>
          <label>Text<input type="search" id="log-filter-text" placeholder="Search messages"></label>
          <button type="button" class="btn btn-secondary" id="log-filter-clear">Clear filters</button>
        </div>

        <p id="log-history-count" class="log-history-count"></p>
        <div id="log-history-list" class="logcat-list"></div>
        <div id="log-history-empty" class="empty-state">
          <i data-lucide="archive"></i>
          <h3>No Archived Logs</h3>
          <p>Logs older than the last three days will appear here.</p>
        </div>

        <div class="page-back-actions">
          <button class="page-back-btn" type="button" data-back-fallback="logcat.html"><i data-lucide="arrow-left"></i> Back to Logcat</button>
        </div>
      </section>
    </main>
  </div>
  <script src="applock.js"></script><script src="metadata.js"></script><script src="app-navigation.js"></script><script src="app-backups.js"></script><script src="app-search.js"></script><script src="app.js"></script><script src="fonts.js"></script>
  <script>
    const historyPreviewLength = 280;

    function historyTime(ms) {
      const date = new Date(ms);
      return `${date.toLocaleDateString()} ${date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })}`;
    }

    function historyFilterEntries(entries) {
      const fromDate = document.getElementById("log-filter-date-from")?.value || "";
      const toDate = document.getElementById("log-filter-date-to")?.value || "";
      const fromTime = document.getElementById("log-filter-time-from")?.value || "";
      const toTime = document.getElementById("log-filter-time-to")?.value || "";
      const level = document.getElementById("log-filter-level")?.value || "all";
      const page = (document.getElementById("log-filter-page")?.value || "").trim().toLowerCase();
      const text = (document.getElementById("log-filter-text")?.value || "").trim().toLowerCase();

      return entries.filter(entry => {
        const date = new Date(entry.time);
        const dateKey = date.toISOString().slice(0, 10);
        const timeKey = date.toTimeString().slice(0, 5);
        return (!fromDate || dateKey >= fromDate)
          && (!toDate || dateKey <= toDate)
          && (!fromTime || timeKey >= fromTime)
          && (!toTime || timeKey <= toTime)
          && (level === "all" || entry.level === level)
          && (!page || String(entry.page || "").toLowerCase().includes(page))
          && (!text || String(entry.message || "").toLowerCase().includes(text));
      });
    }

    function renderHistory() {
      const list = document.getElementById("log-history-list");
      const empty = document.getElementById("log-history-empty");
      const count = document.getElementById("log-history-count");
      if (!list || !empty) return;
      const archived = window.squashdbLogcat?.getArchivedEntries?.() || [];
      const entries = historyFilterEntries(archived).sort((a, b) => b.time - a.time);
      if (count) count.textContent = `${entries.length} archived log${entries.length === 1 ? "" : "s"}`;
      empty.style.display = entries.length ? "none" : "flex";
      list.innerHTML = entries.map(entry => `
        <div class="logcat-row logcat-row-${entry.level}">
          <span class="logcat-row-level">${entry.level}</span>
          <span class="logcat-row-time">${historyTime(entry.time)} · ${entry.page}</span>
          <pre class="logcat-row-message"></pre>
          <button type="button" class="logcat-expand" hidden>Show more</button>
        </div>
      `).join("");
      list.querySelectorAll(".logcat-row").forEach((row, index) => {
        const message = String(entries[index].message || "");
        const messageEl = row.querySelector(".logcat-row-message");
        const expand = row.querySelector(".logcat-expand");
        messageEl.textContent = message.length > historyPreviewLength ? `${message.slice(0, historyPreviewLength)}…` : message;
        if (message.length <= historyPreviewLength) return;
        expand.hidden = false;
        expand.addEventListener("click", () => {
          const expanded = messageEl.classList.toggle("expanded");
          messageEl.textContent = expanded ? message : `${message.slice(0, historyPreviewLength)}…`;
          expand.textContent = expanded ? "Show less" : "Show more";
        });
      });
      if (window.lucide) lucide.createIcons();
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll(".logcat-history-filters input, .logcat-history-filters select").forEach(input => {
        input.addEventListener(input.tagName === "SELECT" ? "change" : "input", renderHistory);
      });
      document.getElementById("log-filter-clear")?.addEventListener("click", () => {
        document.querySelectorAll(".logcat-history-filters input").forEach(input => { input.value = ""; });
        document.getElementById("log-filter-level").value = "all";
        renderHistory();
      });
      renderHistory();
    });
  </script>
</body>
</html>

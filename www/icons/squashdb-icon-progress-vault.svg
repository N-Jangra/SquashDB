    <path d="M308 294 L690 250 C724 246 754 270 759 304 L812 660 C817 694 792 725 758 730 L376 773 C342 777 312 753 307 719 L254 363 C249 329 274 298 308 294 Z" fill="#170d35" opacity="0.32"/>

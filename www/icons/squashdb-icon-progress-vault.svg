<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">SquashDB Progress Vault Icon</title>
  <desc id="desc">A rounded app icon with a progress ring, stacked database vault, check mark, and media status cards.</desc>
  <defs>
    <linearGradient id="vault-bg" x1="88" y1="80" x2="924" y2="947" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#211246"/>
      <stop offset="0.46" stop-color="#4831b8"/>
      <stop offset="1" stop-color="#ff7a49"/>
    </linearGradient>
    <radialGradient id="vault-rad" cx="37%" cy="21%" r="72%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.52" stop-color="#ffbf73" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vault-card" x1="300" y1="246" x2="753" y2="724" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff8ea"/>
      <stop offset="0.45" stop-color="#ffe0a5"/>
      <stop offset="1" stop-color="#ff7a49"/>
    </linearGradient>
    <linearGradient id="vault-inner" x1="330" y1="334" x2="662" y2="679" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2af9d7"/>
      <stop offset="0.6" stop-color="#23aee6"/>
      <stop offset="1" stop-color="#3531b8"/>
    </linearGradient>
    <filter id="vault-shadow" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#180927" flood-opacity="0.52"/>
    </filter>
    <filter id="vault-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.5 0 0 0 0 0.98 0 0 0 0 0.88 0 0 0 0.7 0"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#vault-bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#vault-rad)"/>
  <path d="M139 206 L892 206 M125 335 L915 335 M107 464 L925 464 M121 593 L912 593 M151 722 L873 722" stroke="#ffffff" stroke-opacity="0.06" stroke-width="7" stroke-linecap="round"/>
  <path d="M209 118 L209 864 M338 98 L338 915 M467 89 L467 936 M596 103 L596 927 M725 128 L725 882" stroke="#ffffff" stroke-opacity="0.035" stroke-width="7" stroke-linecap="round"/>


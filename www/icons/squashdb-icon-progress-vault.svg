      <path d="M352 511 C352 552 424 585 512 585 C600 585 672 552 672 511" fill="none" stroke="#ffffff" stroke-opacity="0.36" stroke-width="14"/>
      <path d="M352 586 C352 627 424 660 512 660 C600 660 672 627 672 586" fill="none" stroke="#19104b" stroke-opacity="0.48" stroke-width="20"/>
    </g>

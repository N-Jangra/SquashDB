      <circle cx="138" cy="83" r="18" fill="#30f6d5"/>
      <path d="M130 83 L136 89 L149 75" fill="none" stroke="#1d164f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(688 180) rotate(12)">
      <rect width="168" height="126" rx="35" fill="#170d35"/>
      <rect x="25" y="27" width="30" height="30" rx="8" fill="#ffbf73"/>
      <rect x="69" y="27" width="74" height="13" rx="7" fill="#fff9e8" opacity="0.9"/>
      <rect x="69" y="53" width="55" height="13" rx="7" fill="#2fffe0"/>
      <rect x="25" y="78" width="118" height="14" rx="7" fill="#fff9e8" opacity="0.24"/>

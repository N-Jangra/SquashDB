    <circle cx="512" cy="512" r="338" fill="none" stroke="#79ffe8" stroke-width="42" stroke-linecap="round" stroke-dasharray="72 28" pathLength="100" transform="rotate(-87 512 512)"/>
  </g>
  <circle cx="512" cy="512" r="346" fill="none" stroke="#20143a" stroke-opacity="0.45" stroke-width="52"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">SquashDB APK Icon - Progress Ring</title>
  <desc id="desc">A scalable SquashDB mobile app icon designed for Android APK launcher use.</desc>
  <defs>

    <linearGradient id="r3bg" x1="130" y1="104" x2="878" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071519"/>
      <stop offset="0.52" stop-color="#0A5D58"/>
      <stop offset="1" stop-color="#BDFB57"/>
    </linearGradient>
    <radialGradient id="r3shine" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(295 199) rotate(44) scale(672 452)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.32" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="r3round">
      <rect x="0" y="0" width="1024" height="1024" rx="224"/>
    </clipPath>
    <filter id="r3softShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="30" stdDeviation="28" flood-color="#06101B" flood-opacity="0.34"/>
    </filter>
    <filter id="r3smallShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#06101B" flood-opacity="0.24"/>
    </filter>

    <linearGradient id="r3ring" x1="278" y1="231" x2="753" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EEFF91"/>
      <stop offset="0.45" stop-color="#3DF1CC"/>
      <stop offset="1" stop-color="#31A6FF"/>
    </linearGradient>
    <linearGradient id="r3core" x1="367" y1="348" x2="655" y2="670" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FFFF"/>
      <stop offset="0.5" stop-color="#95FFF2"/>
      <stop offset="1" stop-color="#009D8F"/>
    </linearGradient>
    <linearGradient id="r3check" x1="421" y1="480" x2="625" y2="596" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6FFB4"/>
    </linearGradient>

  </defs>

  <g clip-path="url(#r3round)">
    <rect width="1024" height="1024" fill="url(#r3bg)"/>
    <rect width="1024" height="1024" fill="url(#r3shine)"/>
    <path d="M-76 754C176 650 276 706 454 586C656 449 690 245 1100 188V1100H-76V754Z" fill="#000000" opacity="0.12"/>
    <path d="M0 0H1024V1024H0V0Z" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-opacity="0.12"/>
  </g>


  <g filter="url(#r3softShadow)">
    <circle cx="512" cy="512" r="318" fill="#07131A" opacity="0.28"/>
    <circle cx="512" cy="512" r="284" fill="none" stroke="#FFFFFF" stroke-width="66" stroke-opacity="0.12"/>
    <circle cx="512" cy="512" r="284" fill="none" stroke="url(#r3ring)" stroke-width="66" stroke-linecap="round" stroke-dasharray="1400 385" transform="rotate(-104 512 512)"/>
    <circle cx="754" cy="360" r="42" fill="#EFFF9A" stroke="#FFFFFF" stroke-width="10"/>
    <circle cx="309" cy="690" r="31" fill="#6FFFF2" stroke="#DFFFFB" stroke-width="9"/>
    <path d="M348 426C348 381 421 345 512 345C603 345 676 381 676 426V594C676 639 603 675 512 675C421 675 348 639 348 594V426Z" fill="url(#r3core)" stroke="#E8FFFB" stroke-width="12"/>
    <ellipse cx="512" cy="426" rx="164" ry="67" fill="#F4FFFE" stroke="#FFFFFF" stroke-width="8"/>
    <path d="M349 492C349 537 422 573 512 573C602 573 675 537 675 492" fill="none" stroke="#EFFFF9" stroke-width="12" stroke-opacity="0.68"/>
    <path d="M349 548C349 593 422 629 512 629C602 629 675 593 675 548" fill="none" stroke="#EFFFF9" stroke-width="12" stroke-opacity="0.54"/>
    <path d="M420 522L488 590L622 454" fill="none" stroke="url(#r3check)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

</svg>

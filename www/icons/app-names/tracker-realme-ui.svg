<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
<title id="title">Tracker Realme UI style app icon</title>
<desc id="desc">Original Realme UI inspired mobile launcher icon for Tracker.</desc>

<defs>

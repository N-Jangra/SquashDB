    <stop offset="0.38" stop-color="#FFFFFF" stop-opacity="0.20"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="bottomGlow" cx="76%" cy="86%" r="58%">

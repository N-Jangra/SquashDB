<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
<title id="title">Vault Realme UI style app icon</title>
<desc id="desc">Original Realme UI inspired mobile launcher icon for Vault.</desc>

<defs>
  <clipPath id="realmeSquircle"><rect x="0" y="0" width="1024" height="1024" rx="255" ry="255"/></clipPath>
  <linearGradient id="bg" x1="122" y1="64" x2="912" y2="938" gradientUnits="userSpaceOnUse">

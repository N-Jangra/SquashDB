<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Squash DB glass impact icon</title>
  <desc id="desc">An original Squash DB icon showing a squash ball hitting a glass database panel with cracks spreading from the impact.</desc>
  <defs>
    <linearGradient id="bg" x1="32" y1="20" x2="226" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#102E38"/>
      <stop offset="0.58" stop-color="#072A2E"/>
      <stop offset="1" stop-color="#041C22"/>
    </linearGradient>

    <linearGradient id="glass" x1="62" y1="42" x2="198" y2="218" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2FFFF" stop-opacity="0.86"/>
      <stop offset="0.45" stop-color="#9EE5F3" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#54BCCC" stop-opacity="0.22"/>
    </linearGradient>

    <linearGradient id="glassEdge" x1="48" y1="44" x2="202" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#85F2FF" stop-opacity="0.34"/>
    </linearGradient>

    <linearGradient id="ball" x1="42" y1="62" x2="104" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF58A"/>
      <stop offset="0.52" stop-color="#DDF54E"/>
      <stop offset="1" stop-color="#93D829"/>
    </linearGradient>

    <radialGradient id="impactGlow" cx="112" cy="111" r="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.28" stop-color="#B9F8FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#B9F8FF" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.32"/>
    </filter>

    <filter id="ballShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="8" dy="10" stdDeviation="9" flood-color="#000000" flood-opacity="0.38"/>
    </filter>

    <clipPath id="paneClip">
      <rect x="58" y="40" width="144" height="176" rx="24"/>
    </clipPath>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- Motion streaks behind the squash ball -->
  <g opacity="0.88" stroke-linecap="round" fill="none">
    <path d="M26 83 C43 80 57 82 74 89" stroke="#E8FF71" stroke-width="9" opacity="0.26"/>
    <path d="M18 106 C39 99 58 100 79 109" stroke="#E8FF71" stroke-width="7" opacity="0.42"/>
    <path d="M32 128 C49 120 64 119 82 126" stroke="#FFFFFF" stroke-width="4" opacity="0.42"/>
  </g>

  <!-- Glass database panel -->
  <g filter="url(#shadow)">
    <rect x="58" y="40" width="144" height="176" rx="24" fill="url(#glass)" stroke="url(#glassEdge)" stroke-width="5"/>

    <g clip-path="url(#paneClip)">
      <path d="M70 79 C83 69 178 69 190 79 C178 91 83 91 70 79Z" fill="#FFFFFF" opacity="0.22"/>
      <path d="M70 79 C70 90 97 99 130 99 C163 99 190 90 190 79" fill="none" stroke="#EFFFFF" stroke-width="4" opacity="0.46"/>
      <path d="M70 79 V151 C70 163 97 173 130 173 C163 173 190 163 190 151 V79" fill="#6AD1E3" opacity="0.10"/>
      <path d="M70 111 C70 123 97 132 130 132 C163 132 190 123 190 111" fill="none" stroke="#EFFFFF" stroke-width="4" opacity="0.34"/>
      <path d="M70 145 C70 157 97 166 130 166 C163 166 190 157 190 145" fill="none" stroke="#EFFFFF" stroke-width="4" opacity="0.28"/>

      <path d="M79 54 L188 201" stroke="#FFFFFF" stroke-width="12" opacity="0.12"/>
      <path d="M111 42 L202 165" stroke="#FFFFFF" stroke-width="6" opacity="0.10"/>
    </g>

    <!-- DB label etched into the glass -->
    <text x="132" y="204" text-anchor="middle"
      font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif"
      font-size="38" font-weight="850" letter-spacing="-1"
      fill="#EFFFFF" opacity="0.74">DB</text>
  </g>

  <!-- Impact glow and cracked glass -->
  <circle cx="108" cy="112" r="72" fill="url(#impactGlow)" opacity="0.72"/>

  <g fill="none" stroke="#F7FFFF" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="108" cy="112" r="12" stroke-width="4.5" opacity="0.9"/>
    <circle cx="108" cy="112" r="22" stroke-width="2.5" stroke-dasharray="12 8" opacity="0.62"/>

    <path d="M108 112 L126 78 L139 66" stroke-width="4" opacity="0.86"/>
    <path d="M121 88 L136 91" stroke-width="2.7" opacity="0.72"/>
    <path d="M126 78 L128 58" stroke-width="2.5" opacity="0.58"/>

    <path d="M108 112 L151 101 L180 86" stroke-width="4.3" opacity="0.92"/>
    <path d="M146 102 L158 116 L177 119" stroke-width="2.8" opacity="0.70"/>
    <path d="M157 98 L166 78" stroke-width="2.3" opacity="0.56"/>

    <path d="M108 112 L146 138 L175 164" stroke-width="4.1" opacity="0.86"/>
    <path d="M137 132 L153 130" stroke-width="2.6" opacity="0.70"/>
    <path d="M153 145 L151 165" stroke-width="2.4" opacity="0.56"/>

    <path d="M108 112 L116 151 L112 184" stroke-width="3.9" opacity="0.80"/>
    <path d="M115 148 L131 160" stroke-width="2.5" opacity="0.60"/>
    <path d="M114 166 L96 181" stroke-width="2.4" opacity="0.58"/>

    <path d="M108 112 L82 147 L68 170" stroke-width="3.6" opacity="0.78"/>
    <path d="M88 139 L73 136" stroke-width="2.4" opacity="0.58"/>

    <path d="M108 112 L79 97 L61 91" stroke-width="3.4" opacity="0.62"/>
  </g>

  <!-- Squash ball hitting the pane -->
  <g filter="url(#ballShadow)">
    <circle cx="78" cy="108" r="31" fill="url(#ball)"/>
    <path d="M59 87 C70 78 91 79 102 94" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.42"/>
    <path d="M55 118 C67 132 89 135 103 122" fill="none" stroke="#6CA51F" stroke-width="5" stroke-linecap="round" opacity="0.46"/>
    <circle cx="66" cy="94" r="7" fill="#FFFFFF" opacity="0.55"/>
  </g>

  <!-- Small shards at the hit point -->
  <g fill="#EFFFFF" opacity="0.86">
    <path d="M128 111 L140 106 L137 118Z"/>
    <path d="M116 83 L126 90 L114 94Z" opacity="0.72"/>
    <path d="M121 134 L132 139 L120 145Z" opacity="0.62"/>
    <path d="M96 141 L103 151 L91 151Z" opacity="0.48"/>
  </g>
</svg>

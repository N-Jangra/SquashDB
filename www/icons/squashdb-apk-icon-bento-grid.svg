<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">SquashDB APK Icon - Bento Grid</title>
  <desc id="desc">A scalable SquashDB mobile app icon designed for Android APK launcher use.</desc>
  <defs>

    <linearGradient id="b4bg" x1="130" y1="104" x2="878" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E1744"/>
      <stop offset="0.52" stop-color="#7057FF"/>
      <stop offset="1" stop-color="#FFB23B"/>
    </linearGradient>
    <radialGradient id="b4shine" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(295 199) rotate(44) scale(672 452)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.32" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="b4round">
      <rect x="0" y="0" width="1024" height="1024" rx="224"/>
    </clipPath>
    <filter id="b4softShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="30" stdDeviation="28" flood-color="#06101B" flood-opacity="0.34"/>
    </filter>
    <filter id="b4smallShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#06101B" flood-opacity="0.24"/>
    </filter>

    <linearGradient id="b4panel" x1="246" y1="233" x2="781" y2="796" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#E8F2FF"/>
      <stop offset="1" stop-color="#B6CCFF"/>
    </linearGradient>
    <linearGradient id="b4tileA" x1="307" y1="315" x2="518" y2="524" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A5FFF3"/>
      <stop offset="1" stop-color="#17B5D2"/>
    </linearGradient>
    <linearGradient id="b4tileB" x1="529" y1="315" x2="718" y2="505" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF184"/>
      <stop offset="1" stop-color="#FF8D2E"/>
    </linearGradient>
    <linearGradient id="b4tileC" x1="315" y1="532" x2="718" y2="724" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E6FF8C"/>
      <stop offset="0.48" stop-color="#56E28B"/>
      <stop offset="1" stop-color="#25D3D5"/>
    </linearGradient>
    <linearGradient id="b4db" x1="415" y1="446" x2="614" y2="662" gradientUnits="userSpaceOnUse">

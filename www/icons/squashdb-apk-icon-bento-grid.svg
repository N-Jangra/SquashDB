    <rect width="1024" height="1024" fill="url(#b4shine)"/>
    <path d="M-76 754C176 650 276 706 454 586C656 449 690 245 1100 188V1100H-76V754Z" fill="#000000" opacity="0.12"/>
    <path d="M0 0H1024V1024H0V0Z" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-opacity="0.12"/>
  </g>


  <g filter="url(#b4softShadow)">

    <rect x="311" y="316" width="190" height="176" rx="56" fill="url(#b4tileA)"/>
    <rect x="523" y="316" width="190" height="176" rx="56" fill="url(#b4tileB)"/>
    <rect x="311" y="514" width="402" height="188" rx="64" fill="url(#b4tileC)"/>
    <path d="M385 363L460 405L385 448V363Z" fill="#FFFFFF" opacity="0.90"/>
    <path d="M568 378H668" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" opacity="0.84"/>
    <path d="M568 427H638" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" opacity="0.62"/>
    <path d="M364 608H660" stroke="#FFFFFF" stroke-width="19" stroke-linecap="round" opacity="0.76"/>
    <path d="M364 652H584" stroke="#FFFFFF" stroke-width="19" stroke-linecap="round" opacity="0.52"/>
    <g filter="url(#b4smallShadow)">

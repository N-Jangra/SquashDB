      <ellipse cx="514" cy="485" rx="125" ry="51" fill="#F8FFFF" stroke="#FFFFFF" stroke-width="7"/>
      <path d="M390 535C390 570 446 598 514 598C582 598 638 570 638 535" fill="none" stroke="#12A5AC" stroke-opacity="0.34" stroke-width="10"/>
    </g>
    <path d="M444 246C492 207 557 214 603 263C555 307 492 311 440 276C432 271 435 253 444 246Z" fill="#BAFF73" stroke="#F5FFD5" stroke-width="9"/>
    <path d="M459 266C505 267 543 277 585 302" fill="none" stroke="#2E9450" stroke-width="7" stroke-opacity="0.42" stroke-linecap="round"/>
  </g>

</svg>

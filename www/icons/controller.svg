<svg xmlns="http://www.w3.org/2000/svg" width="190" height="190" viewBox="0 0 190 190">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06151c"/>
      <stop offset="1" stop-color="#02080d"/>
    </linearGradient>

    <radialGradient id="cornerGlow" cx="0.18" cy="0.12" r="0.95">
      <stop offset="0" stop-color="#0c3a43" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0c3a43" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bottomGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#20f2d0" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="#20f2d0" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#20f2d0" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="tinyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0.75" y="0.75" width="188.5" height="188.5" rx="22"
        fill="url(#bg)" stroke="#0e2a31" stroke-width="1.5"/>
  <rect x="1" y="1" width="188" height="188" rx="22" fill="url(#cornerGlow)"/>

  <!-- subtle lower cyan glow -->
  <ellipse cx="95" cy="165" rx="54" ry="13" fill="url(#bottomGlow)"/>
  <ellipse cx="95" cy="165" rx="27" ry="4.5" fill="#39f2cf" opacity="0.16" filter="url(#softGlow)"/>

  <!-- gamepad outline -->
  <path
    d="M54 44
       C42 44 34 50 30 60
       C27 68 24 80 22 91
       L17 116
       C15 127 20 138 29 143
       C38 148 49 144 56 135
       L67 121
       C70 117 74 115 79 115
       H111
       C116 115 120 117 123 121
       L134 135
       C141 144 152 148 161 143
       C170 138 175 127 173 116
       L168 91
       C166 80 163 68 160 60
       C156 50 148 44 136 44
       C128 44 123 47 118 51
       L113 55
       H77
       L72 51
       C67 47 62 44 54 44 Z"
    fill="none"
    stroke="#20f2d0"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#softGlow)"/>

  <!-- d-pad -->
  <path
    d="M49 67
       H59
       V77
       H69
       V87
       H59
       V97
       H49
       V87
       H39
       V77
       H49 Z"
    fill="none"
    stroke="#20f2d0"
    stroke-width="5.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#tinyGlow)"/>

  <!-- action buttons -->
  <circle cx="127" cy="72" r="6.2" fill="#20f2d0" filter="url(#tinyGlow)"/>
  <circle cx="142" cy="84" r="6.2" fill="#20f2d0" filter="url(#tinyGlow)"/>
  <circle cx="127" cy="96" r="6.2" fill="#20f2d0" filter="url(#tinyGlow)"/>
  <circle cx="112" cy="84" r="6.2" fill="#20f2d0" filter="url(#tinyGlow)"/>
</svg>
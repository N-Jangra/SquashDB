<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">SquashDB Orbit Hub Icon</title>
  <desc id="desc">A rounded app icon showing a database hub with an S-shaped progress path and orbiting media cards.</desc>
  <defs>
    <linearGradient id="hub-bg" x1="96" y1="64" x2="928" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071526"/>
      <stop offset="0.46" stop-color="#0a5366"/>
      <stop offset="1" stop-color="#15d6a7"/>
    </linearGradient>
    <radialGradient id="hub-glow" cx="50%" cy="30%" r="72%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.36"/>
      <stop offset="0.44" stop-color="#3cf6e6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#06101e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hub-db" x1="310" y1="294" x2="720" y2="744" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8fff8"/>
      <stop offset="0.32" stop-color="#90f6dc"/>
      <stop offset="0.72" stop-color="#1898b5"/>
      <stop offset="1" stop-color="#074463"/>
    </linearGradient>
    <linearGradient id="hub-top" x1="364" y1="306" x2="650" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#d9fff5"/>
      <stop offset="1" stop-color="#42d8c1"/>
    </linearGradient>
    <linearGradient id="hub-s" x1="379" y1="280" x2="645" y2="686" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#e7fff9"/>
      <stop offset="1" stop-color="#b1fff1"/>
    </linearGradient>
    <filter id="hub-shadow" x="-24%" y="-24%" width="148%" height="148%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#02101a" flood-opacity="0.45"/>
    </filter>
    <filter id="hub-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#hub-bg)"/>

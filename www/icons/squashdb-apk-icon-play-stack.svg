    <rect width="1024" height="1024" fill="url(#p2shine)"/>
    <path d="M-76 754C176 650 276 706 454 586C656 449 690 245 1100 188V1100H-76V754Z" fill="#000000" opacity="0.12"/>
    <path d="M0 0H1024V1024H0V0Z" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-opacity="0.12"/>
  </g>


  <g filter="url(#p2softShadow)">
    <path d="M261 322C261 261 311 211 372 211H652C713 211 763 261 763 322V633C763 694 713 744 652 744H372C311 744 261 694 261 633V322Z" fill="url(#p2card)" stroke="#FFFFFF" stroke-width="16"/>
    <path d="M321 594C321 553 406 520 512 520C618 520 703 553 703 594V668C703 709 618 742 512 742C406 742 321 709 321 668V594Z" fill="url(#p2stack)" stroke="#EFFFFF" stroke-width="11"/>
    <ellipse cx="512" cy="594" rx="191" ry="74" fill="#EFFFFF" opacity="0.95" stroke="#FFFFFF" stroke-width="8"/>
    <path d="M322 654C322 695 407 728 512 728C617 728 702 695 702 654" fill="none" stroke="#0C8EA5" stroke-opacity="0.35" stroke-width="12"/>
    <path d="M426 348C426 316 462 296 490 313L652 412C681 430 681 472 652 490L490 589C462 606 426 586 426 553V348Z" fill="url(#p2play)" stroke="#FFF4BE" stroke-width="12"/>
    <path d="M462 358L626 459L462 559V358Z" fill="#FFFFFF" opacity="0.88"/>
    <path d="M365 287C402 253 453 255 493 288C458 329 407 342 361 315C354 311 357 294 365 287Z" fill="url(#p2leaf)" stroke="#F8FFD3" stroke-width="9"/>
    <path d="M374 304C417 302 447 308 482 327" fill="none" stroke="#268A47" stroke-width="7" stroke-opacity="0.40" stroke-linecap="round"/>
    <circle cx="739" cy="300" r="37" fill="#FFFFFF" opacity="0.22"/>
    <circle cx="295" cy="724" r="29" fill="#B7FFF3" opacity="0.30"/>

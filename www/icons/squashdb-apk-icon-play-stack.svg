    <linearGradient id="p2leaf" x1="362" y1="256" x2="498" y2="356" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3FF9F"/>
      <stop offset="1" stop-color="#60E070"/>
    </linearGradient>

  </defs>

  <g clip-path="url(#p2round)">

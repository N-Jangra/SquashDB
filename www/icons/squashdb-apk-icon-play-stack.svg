<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">SquashDB APK Icon - Play Stack</title>
  <desc id="desc">A scalable SquashDB mobile app icon designed for Android APK launcher use.</desc>
  <defs>

    <linearGradient id="p2bg" x1="130" y1="104" x2="878" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#21114A"/>
      <stop offset="0.52" stop-color="#2656DC"/>
      <stop offset="1" stop-color="#31DFB7"/>
    </linearGradient>
    <radialGradient id="p2shine" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(295 199) rotate(44) scale(672 452)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.32" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="p2round">
      <rect x="0" y="0" width="1024" height="1024" rx="224"/>
    </clipPath>
    <filter id="p2softShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="30" stdDeviation="28" flood-color="#06101B" flood-opacity="0.34"/>
    </filter>
    <filter id="p2smallShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#06101B" flood-opacity="0.24"/>
    </filter>

    <linearGradient id="p2card" x1="283" y1="222" x2="733" y2="777" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.62" stop-color="#C3ECFF"/>
      <stop offset="1" stop-color="#64BDF1"/>
    </linearGradient>
    <linearGradient id="p2stack" x1="322" y1="571" x2="707" y2="776" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EFFFFF"/>
      <stop offset="1" stop-color="#20BFD2"/>
    </linearGradient>
    <linearGradient id="p2play" x1="439" y1="349" x2="651" y2="567" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFDE6E"/>
      <stop offset="1" stop-color="#FF7A2D"/>
